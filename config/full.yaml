# Nuclei config profile — FULL.
#
# Adds DAST/fuzzing (SQLi, XSS, SSTI, command injection, path traversal) and
# default-credential checks. This sends malicious payloads. It is gated behind
# CONFIRM=yes for any group containing prod, and hosts that proxy to a
# third-party origins opt out via `profiles` in their inventory target document.
#
# DoS remains excluded unconditionally — there is no scenario where we want it.
#
# Used via: nuclei -config config/full.yaml

severity:
  - critical
  - high
  - medium
  - low
  - info

type:
  - dns
  - ssl
  - tcp
  - http
  - javascript

exclude-tags:
  - dos

dast: true
fuzzing-type: replace
payload-concurrency: 25

rate-limit: 150
concurrency: 25
bulk-size: 25
timeout: 10
retries: 1
max-redirects: 5

disable-update-check: true
stats: true
stats-interval: 30

header:
  - 'User-Agent: flanksource-security-scan/nuclei (+security@flanksource.com)'
  - 'X-Flanksource-Scan: nuclei-full'

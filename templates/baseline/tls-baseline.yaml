id: flanksource-tls-baseline

info:
  name: Flanksource - TLS Baseline
  author: flanksource
  severity: medium
  description: |
    Asserts the Flanksource TLS baseline on every internet-facing endpoint:
    TLS 1.0 and 1.1 must be refused, the certificate must be trusted and must match
    the hostname, and it must not be inside the 21-day cert-manager renewal window
    (which would mean ACME renewal is failing).
  remediation: |
    Certificates are issued by the `ingress-ca` ClusterIssuer via Let's Encrypt
    dns01/http01 solvers — see specs/workload-prod-eu-02/cert-manager/resources/cluster-issuer.yml.
    A stuck renewal usually means the cloudDNS solver lost permissions on the zone.
  reference:
    - https://ssl-config.mozilla.org/
  metadata:
    max-request: 3
  tags: flanksource,baseline,ssl,tls

ssl:
  - address: '{{Host}}:{{Port}}'
    min_version: tls10
    max_version: tls10
    matchers:
      - type: dsl
        name: tls-1-0-enabled
        dsl:
          - "tls_version == 'tls10'"

  - address: '{{Host}}:{{Port}}'
    min_version: tls11
    max_version: tls11
    matchers:
      - type: dsl
        name: tls-1-1-enabled
        dsl:
          - "tls_version == 'tls11'"

  - address: '{{Host}}:{{Port}}'
    matchers-condition: or
    matchers:
      - type: dsl
        name: certificate-expired
        dsl:
          - 'expired == true'

      # 1814400s = 21 days. cert-manager renews at 30 days, so anything inside
      # 21 days means renewal has already failed at least once.
      - type: dsl
        name: certificate-expiring-within-21-days
        dsl:
          - 'expired == false'
          - 'to_unix_time(not_after) < unix_time(1814400)'
        condition: and

      - type: dsl
        name: certificate-self-signed
        dsl:
          - 'self_signed == true'

      - type: dsl
        name: certificate-hostname-mismatch
        dsl:
          - 'mismatched == true'
          - 'ip != host'
        condition: and

      - type: dsl
        name: certificate-untrusted
        dsl:
          - 'untrusted == true'

    extractors:
      - type: dsl
        dsl:
          - '"CN=" + subject_cn + " not_after=" + not_after'
